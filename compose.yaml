# Lingkungan pengembangan & pengujian prototipe SIMAPEL.
# Jalankan lewat Makefile (`make setup`, `make up`) atau `docker compose` langsung.
# Semua port hanya terikat ke 127.0.0.1 agar tidak terbuka ke jaringan kantor.

name: simapel

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: simapel-app:dev
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db:
    image: mysql:26.7
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-simapel}
      MYSQL_USER: ${DB_USERNAME:-simapel}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env (jalankan make setup)}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di .env (jalankan make setup)}
      TZ: Asia/Jakarta
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  adminer:
    profiles: ["tools"]
    image: adminer:6.3.0-standalone
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

  playwright:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
    environment:
      E2E_BASE_URL: http://web
      E2E_NIP: ${E2E_NIP:-999900000000000001}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
      CI: ${CI:-}
    ipc: host
    depends_on:
      web:
        condition: service_healthy

volumes:
  db-data:
  e2e-node-modules:
