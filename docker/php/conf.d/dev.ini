; Hanya untuk target dev
memory_limit = 512M
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; Kode di-mount dari host, jadi OPcache wajib memeriksa perubahan file.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; PCOV hanya aktif saat dibutuhkan: php -d pcov.enabled=1 ...
pcov.enabled = 0
pcov.directory = /var/www/html/app
