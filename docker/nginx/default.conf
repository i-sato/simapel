server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 12m;

    # Header keamanan untuk respons dinamis diatur aplikasi (SecurityHeaders middleware).
    # Blok ini hanya untuk aset statis yang tidak melewati PHP.
    location ~* \.(?:css|js|ico|png|jpe?g|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location = /robots.txt { access_log off; log_not_found off; }

    # Tolak dotfile (.env, .git, dll.) kecuali .well-known.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # File PHP lain di public/ tidak boleh dieksekusi.
    location ~ \.php$ {
        return 404;
    }
}
