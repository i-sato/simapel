version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns: ["laravel/*", "larastan/*"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta

  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    ignore:
      # Versi image Playwright harus sama dengan @playwright/test di e2e/package.json;
      # perbarui keduanya bersamaan secara manual.
      - dependency-name: "mcr.microsoft.com/playwright"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
