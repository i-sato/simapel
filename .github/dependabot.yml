version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns: ["laravel/*", "larastan/*"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    ignore:
      # Harus sama dengan image Docker Playwright; perbarui keduanya bersamaan secara manual
      # (diperiksa oleh scripts/check-playwright-version.sh).
      - dependency-name: "@playwright/test"
      - dependency-name: "playwright"

  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    ignore:
      # Versi image Playwright harus sama dengan @playwright/test di e2e/package.json;
      # perbarui keduanya bersamaan secara manual. Dependabot menamai image ini "playwright"
      # (PR #8 tetap terbuka karena aturan lama hanya memakai nama lengkap).
      - dependency-name: "playwright"
      - dependency-name: "mcr.microsoft.com/playwright"
      # ADR 0002: MySQL 8.4 LTS (sama dengan CI). Upgrade seri mayor diputuskan lewat ADR baru.
      - dependency-name: "mysql"
        versions: [">= 9"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
